name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The build-and-verify contract every DPYC MCP shares: install the way
      # Horizon installs (uv sync --locked), lint, prove the entrypoint with
      # `fastmcp inspect`, run the suite. Without the inspect step a server
      # that cannot start still shows green, which is how optionality-mcp sat
      # four days stale. A composite action, so this job keeps its `test` name.
      - uses: lonniev/dpyc-community/.github/actions/mcp-ci@main
